# SPIKE-GROUNDTRUTH — repository validation tooling

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["tools", "tests"]
extend-exclude = [".tool-cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["groundtruth_validation"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "tools"
explicit_package_bases = true
files = ["tools", "tests"]
cache_dir = ".tool-cache/mypy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "--strict-config --strict-markers"
cache_dir = ".tool-cache/pytest"

[tool.coverage.run]
branch = true
source = ["tools", "tests"]
patch = ["subprocess"]
data_file = ".tool-cache/coverage/data"

[tool.coverage.report]
fail_under = 100
show_missing = true
precision = 2
