# SPIKE-GROUNDTRUTH — repository configuration

name: Feature request
description: Propose a concrete stimulus or repository validation use case.
title: "[feature] "
body:
  - type: textarea
    id: use-case
    attributes:
      label: Use case and affected contract
      description: State the required behaviour and its current limitation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: Describe observable success, refusal cases and actual producer or consumer.
    validations:
      required: true
