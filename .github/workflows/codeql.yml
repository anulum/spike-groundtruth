# SPIKE-GROUNDTRUTH — repository validation tooling

name: Python CodeQL analysis without upload
'on':
  workflow_call:
permissions:
  contents: read
concurrency:
  group: groundtruth-codeql-${{ github.ref }}
  cancel-in-progress: true
jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: 'false'
    - name: Retrieve the exact CodeQL analysis bundle
      env:
        CODEQL_BUNDLE_URL: https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.2/codeql-bundle-linux64.tar.gz
        CODEQL_BUNDLE_SHA256: f002864be6dd8d5d7bdb123aaf7291ec8e291012bd9f70b6d2362f730db52aeb
      run: 'curl --fail --location --silent --show-error --max-time 180 --output "$RUNNER_TEMP/codeql-bundle.tar.gz"
        "$CODEQL_BUNDLE_URL"

        printf ''%s  %s\n'' "$CODEQL_BUNDLE_SHA256" "$RUNNER_TEMP/codeql-bundle.tar.gz" | sha256sum --check
        --status

        '
    - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
      with:
        languages: python
        tools: ${{ runner.temp }}/codeql-bundle.tar.gz
        build-mode: none
        ram: '2048'
        threads: '1'
    - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
      with:
        upload: never
        upload-database: 'false'
        wait-for-processing: 'false'
